version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # D30: patch and minor grouped; each major in its own pull request. The
  # Flutter SDK is bumped by hand (pubspec.yaml and code-ci.yml together).
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]
