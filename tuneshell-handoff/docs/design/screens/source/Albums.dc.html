<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Albums</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: {{t.surface}}; color: {{t.onSurface}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 40px; flex-shrink: 0"></div>

  <sc-if value="{{isGrid}}" hint-placeholder-val="{{ true }}">
    <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; padding: 0 4px 0 16px; gap: 4px">
      <h1 style="margin: 0; flex: 1; font-family: Manrope, sans-serif; font-size: 28px; line-height: 36px; font-weight: 800">Albums</h1>
      <button aria-label="Rechercher (bientôt)" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: {{t.onSurfVar}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    </header>
    <div style="flex-shrink: 0; height: 48px; display: flex; align-items: center; padding: 0 4px 0 16px">
      <span style="flex: 1; font-size: 13px; font-weight: 500; color: {{t.onSurfVar}}; font-variant-numeric: tabular-nums">214 albums</span>
      <button style="height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: {{t.onSurfVar}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h11M4 12h8M4 17h5"/><path d="M18 6v13m0 0l-3-3m3 3l3-3"/></svg>
        Artiste de l'album
      </button>
    </div>
    <div style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 0">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 16px">
        <sc-for list="{{albums}}" as="a" hint-placeholder-count="6">
          <button aria-label="{{a.aria}}" style="display: flex; flex-direction: column; gap: 8px; text-align: left">
            <div style="width: 100%; aspect-ratio: 1 / 1; border-radius: 16px; background: {{a.bg}}; opacity: {{a.op}}; display: flex; align-items: center; justify-content: center; overflow: hidden">
              <sc-if value="{{a.hasCover}}" hint-placeholder-val="{{ true }}"><div style="width: 62%; height: 62%; border-radius: {{a.r}}; background: {{a.fg}}; transform: {{a.tr}}"></div></sc-if>
              <sc-if value="{{a.noCover}}" hint-placeholder-val="{{ false }}"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="{{t.onSurfVar}}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg></sc-if>
            </div>
            <div style="display: flex; flex-direction: column; min-width: 0">
              <span style="font-size: 15px; line-height: 22px; font-weight: 600; color: {{a.titleColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.title}}</span>
              <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 18px; color: {{a.subColor}}; white-space: nowrap; overflow: hidden">
                <sc-if value="{{a.off}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v4M15 3v4M7 7h10v4a5 5 0 0 1-10 0zM12 16v5"/><path d="M3 3l18 18"/></svg></sc-if>
                <span style="overflow: hidden; text-overflow: ellipsis">{{a.sub}}</span>
              </span>
            </div>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
    <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 4px">
      <button aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <span style="flex: 1"></span>
      <button aria-label="Plus d'options" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
    </header>
    <div style="flex-shrink: 0; display: flex; gap: 16px; padding: 4px 16px 16px; align-items: flex-end">
      <div style="width: 152px; height: 152px; flex-shrink: 0; border-radius: 16px; background: #3E6B73; overflow: hidden; display: flex; align-items: center; justify-content: center"><div style="width: 96px; height: 96px; border-radius: 50%; background: #E8C77E; transform: translate(20px, 26px)"></div></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: Manrope, sans-serif; font-size: 26px; line-height: 32px; font-weight: 800">Littoral</h1>
        <span style="font-size: 15px; line-height: 22px; color: {{t.primary}}; font-weight: 600">Les Brumes</span>
        <span style="font-size: 13px; line-height: 18px; color: {{t.onSurfVar}}; font-variant-numeric: tabular-nums">2019 · Ambient<br>2 disques · 14 pistes · 58 min</span>
      </div>
    </div>
    <div style="flex-shrink: 0; display: flex; gap: 12px; padding: 0 16px 8px">
      <button style="flex: 1; height: 48px; border-radius: 24px; background: {{t.primary}}; color: {{t.onPrimary}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.9l10-6.4a1 1 0 0 0 0-1.7l-10-6.4A1 1 0 0 0 8 5.6z"/></svg>Lire</button>
      <button style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid {{t.outline}}; color: {{t.primary}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Aléatoire</button>
    </div>
    <div role="list" style="flex: 1; min-height: 0; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <sc-if value="{{r.isHead}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; padding: 12px 16px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.onSurfVar}}">{{r.label}}</p>
        </sc-if>
        <sc-if value="{{r.isTrack}}" hint-placeholder-val="{{ true }}">
          <button role="listitem" aria-label="{{r.aria}}" style="width: 100%; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 16px; box-sizing: border-box; background: {{r.bg}}; text-align: left">
            <span style="width: 28px; flex-shrink: 0; text-align: center; font-size: 14px; font-weight: 600; color: {{r.numColor}}; font-variant-numeric: tabular-nums">{{r.num}}</span>
            <span style="flex: 1; min-width: 0; font-size: 16px; line-height: 24px; font-weight: {{r.weight}}; color: {{r.titleColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
            <span style="font-size: 12px; font-weight: 500; color: {{t.onSurfVar}}; font-variant-numeric: tabular-nums">{{r.dur}}</span>
          </button>
        </sc-if>
      </sc-for>
    </div>
  </sc-if>

  <div style="flex-shrink: 0; margin: 0 8px 8px; height: 64px; border-radius: 16px; background: {{t.surfContHigh}}; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 8px; position: relative; overflow: hidden">
    <button aria-label="Ouvrir le lecteur" style="flex: 1; min-width: 0; height: 64px; display: flex; align-items: center; gap: 12px; text-align: left">
      <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 8px; background: #3E6B73; display: flex; align-items: center; justify-content: center; overflow: hidden"><div style="width: 30px; height: 30px; border-radius: 50%; background: #E8C77E; transform: translate(6px, 8px)"></div></div>
      <div style="min-width: 0; display: flex; flex-direction: column"><span style="font-size: 14px; line-height: 20px; font-weight: 600">Aube sur le fleuve</span><span style="font-size: 12px; line-height: 16px; color: {{t.onSurfVar}}">Les Brumes</span></div>
    </button>
    <button aria-label="Piste précédente" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="2.4" height="14" rx="1"/><path d="M19 5.8v12.4a.8.8 0 0 1-1.2.7L9 12.7a.8.8 0 0 1 0-1.4l8.8-6.2a.8.8 0 0 1 1.2.7z"/></svg></button>
    <button aria-label="Pause" style="width: 48px; height: 48px; border-radius: 24px; background: {{t.primary}}; color: {{t.onPrimary}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
    <button aria-label="Piste suivante" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="16.6" y="5" width="2.4" height="14" rx="1"/><path d="M5 5.8v12.4a.8.8 0 0 0 1.2.7L15 12.7a.8.8 0 0 0 0-1.4L6.2 5.1A.8.8 0 0 0 5 5.8z"/></svg></button>
    <div aria-hidden="true" style="position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: {{t.outlineVar}}"><div style="width: 38%; height: 2px; background: {{t.primary}}"></div></div>
  </div>

  <nav aria-label="Navigation principale" style="flex-shrink: 0; height: 80px; background: {{t.surfCont}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.onSurfVar}}">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500">Pistes</span>
    </a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.onSurface}}">
      <span style="width: 64px; height: 32px; border-radius: 16px; background: {{t.secCont}}; color: {{t.onSecCont}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/><circle cx="10" cy="14" r="2.5"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 600">Albums</span>
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.onSurfVar}}">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500">Artistes</span>
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.onSurfVar}}">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500">Réglages</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"view":{"editor":"enum","options":["grille","detail"],"default":"grille"},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const detail = (this.props.view ?? 'grille') === 'detail';
    const t = dark ? {
      surface: '#0F1522', surfCont: '#1B2230', surfContHigh: '#252D3A', onSurface: '#DEE3EA', onSurfVar: '#BCC6D2',
      outline: '#8A94A2', outlineVar: '#3B4555', primary: '#6FE3D0', onPrimary: '#00382F', secCont: '#24464A', onSecCont: '#CCE8E2',
      unavail: '#8A94A2', playRow: '#123036'
    } : {
      surface: '#F5FAFA', surfCont: '#E9EFEF', surfContHigh: '#E3E9E9', onSurface: '#171D1E', onSurfVar: '#3F4949',
      outline: '#6F797A', outlineVar: '#BEC8C9', primary: '#00695C', onPrimary: '#FFFFFF', secCont: '#CCE8E2', onSecCont: '#051F1C',
      unavail: '#6A7475', playRow: '#DDF3EE'
    };
    const albums = [
      ['Après coup', 'Clara Vey · 2021', ['#6E7F5C', '#D9CBA3', '50%', 'translate(-12%, 12%)']],
      ['Littoral', 'Les Brumes · 2019', ['#3E6B73', '#E8C77E', '50%', 'translate(14%, 18%)']],
      ['Champs magnétiques', 'Nodal · 2017', ['#5B4B73', '#C9B8E0', '8px', 'rotate(45deg)'], true],
      ['Album inconnu', 'Artiste inconnu · 37 pistes', null],
      ['Soirs d’été', 'Théo Lune · 2022', ['#9A5B3C', '#F0D9C4', '50% 50% 0 0', 'translate(0, 20%)']],
      ['Azur', 'Mona Ferrand · 2015', ['#2F4F7A', '#A9C7FF', '50%', 'translate(0, -14%)']]
    ].map(([title, sub, c, off]) => ({
      title, sub, off: !!off, hasCover: !!c, noCover: !c,
      aria: title + ', ' + sub + (off ? ', indisponible : SSD non connecté' : ''),
      bg: c ? c[0] : t.surfContHigh, fg: c ? c[1] : 'transparent', r: c ? c[2] : '0', tr: c ? c[3] : 'none',
      op: off ? 0.35 : 1,
      titleColor: off ? t.unavail : t.onSurface, subColor: off ? t.unavail : t.onSurfVar
    }));
    const rows = [
      { head: 'Disque 1' },
      { n: 1, title: 'Marée basse', dur: '3:51' },
      { n: 2, title: 'Phare', dur: '5:12' },
      { n: 3, title: 'Aube sur le fleuve', dur: '4:18', playing: true },
      { n: 4, title: 'Battements', dur: '3:58' },
      { head: 'Disque 2' },
      { n: 1, title: 'Laisse de mer', dur: '6:04' },
      { n: 2, title: 'Estran', dur: '4:40' }
    ].map((r) => r.head ? { isHead: true, isTrack: false, label: r.head } : {
      isHead: false, isTrack: true, num: r.playing ? '▶' : String(r.n), title: r.title, dur: r.dur,
      aria: 'Piste ' + r.n + ', ' + r.title + ', ' + r.dur + (r.playing ? ', en lecture' : ''),
      bg: r.playing ? t.playRow : 'transparent',
      weight: r.playing ? 600 : 500,
      titleColor: r.playing ? t.primary : t.onSurface,
      numColor: r.playing ? t.primary : t.onSurfVar
    });
    return { t, albums, rows, isGrid: !detail, isDetail: detail };
  }
}
</script>
</body>
</html>
