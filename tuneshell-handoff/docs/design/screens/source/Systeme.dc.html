<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Notification et écran verrouillé</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: {{bg}}; color: {{fg}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 40px 16px 24px; gap: 12px">

  <sc-if value="{{isLock}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; align-items: center; padding: 48px 0 40px; gap: 4px">
      <span style="font-size: 88px; line-height: 96px; font-weight: 400; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">14:32</span>
      <span style="font-size: 16px; line-height: 24px; color: {{fgVar}}">vendredi 23 octobre</span>
    </div>
  </sc-if>

  <sc-if value="{{isShade}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-bottom: 8px">
      <div style="height: 64px; border-radius: 32px; background: {{tile}}"></div>
      <div style="height: 64px; border-radius: 32px; background: {{tile}}"></div>
      <div style="height: 64px; border-radius: 32px; background: {{tile}}"></div>
      <div style="height: 64px; border-radius: 32px; background: {{tile}}"></div>
    </div>
  </sc-if>

  <section aria-label="Commandes de lecture TuneShell" style="border-radius: 24px; background: #23434A; color: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; background: #3E6B73; overflow: hidden; display: flex; align-items: center; justify-content: center"><div style="width: 36px; height: 36px; border-radius: 50%; background: #E8C77E; transform: translate(8px, 10px)"></div></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 16px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Aube sur le fleuve</span>
        <span style="font-size: 14px; line-height: 20px; color: #D6E4E6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Les Brumes</span>
      </div>
      <svg width="20" height="20" viewBox="22 22 64 64" role="img" aria-label="TuneShell"><g fill="#FFFFFF"><path d="M52.43 83.96L44.23 82.37L36.79 78.57L40.52 73.25L46.35 76.22L52.77 77.47ZM35.12 77.31L29.43 71.21L25.63 63.77L31.78 61.65L34.75 67.48L39.21 72.26ZM25.02 61.76L24.0 54.0L25.02 46.24L31.3 47.92L30.5 54.0L31.3 60.08ZM25.63 44.23L29.43 36.79L35.12 30.69L39.21 35.74L34.75 40.52L31.78 46.35ZM36.79 29.43L44.23 25.63L52.43 24.04L52.77 30.53L46.35 31.78L40.52 34.75Z"/><path d="M55.78 28.56A25.5 25.5 0 0 1 55.78 79.44L55.53 75.95A22 22 0 0 0 55.53 32.05Z"/><circle cx="54" cy="54" r="10"/></g><path fill="none" stroke="#FFFFFF" stroke-width="3.5" d="M55.03 24.52A29.5 29.5 0 0 1 55.03 83.48"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.3)"><div style="width: 38%; height: 4px; border-radius: 2px; background: #FFFFFF"></div></div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #D6E4E6; font-variant-numeric: tabular-nums"><span>1:38</span><span>4:18</span></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Lecture aléatoire" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button aria-label="Piste précédente" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="2.4" height="14" rx="1"/><path d="M19 5.8v12.4a.8.8 0 0 1-1.2.7L9 12.7a.8.8 0 0 1 0-1.4l8.8-6.2a.8.8 0 0 1 1.2.7z"/></svg></button>
      <button aria-label="Pause" style="width: 56px; height: 56px; border-radius: 20px; background: #E8C77E; color: #23434A; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
      <button aria-label="Piste suivante" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="16.6" y="5" width="2.4" height="14" rx="1"/><path d="M5 5.8v12.4a.8.8 0 0 0 1.2.7L15 12.7a.8.8 0 0 0 0-1.4L6.2 5.1A.8.8 0 0 0 5 5.8z"/></svg></button>
      <button aria-label="Répéter" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
    </div>
  </section>

  <sc-if value="{{isShade}}" hint-placeholder-val="{{ true }}">
    <section aria-label="Notification de parcours" style="border-radius: 24px; background: {{card}}; padding: 16px; display: flex; gap: 12px; align-items: flex-start">
      <div style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="22 22 64 64" aria-hidden="true"><g fill="{{onAccent}}"><path d="M52.43 83.96L44.23 82.37L36.79 78.57L40.52 73.25L46.35 76.22L52.77 77.47ZM35.12 77.31L29.43 71.21L25.63 63.77L31.78 61.65L34.75 67.48L39.21 72.26ZM25.02 61.76L24.0 54.0L25.02 46.24L31.3 47.92L30.5 54.0L31.3 60.08ZM25.63 44.23L29.43 36.79L35.12 30.69L39.21 35.74L34.75 40.52L31.78 46.35ZM36.79 29.43L44.23 25.63L52.43 24.04L52.77 30.53L46.35 31.78L40.52 34.75Z"/><path d="M55.78 28.56A25.5 25.5 0 0 1 55.78 79.44L55.53 75.95A22 22 0 0 0 55.53 32.05Z"/><circle cx="54" cy="54" r="10"/></g></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; line-height: 16px; color: {{fgVar}}">TuneShell · maintenant</span>
        <span style="font-size: 15px; line-height: 20px; font-weight: 600">Parcours du SSD</span>
        <span style="font-size: 14px; line-height: 20px; color: {{fgVar}}; font-variant-numeric: tabular-nums">1 240 / 3 100 fichiers</span>
        <div style="height: 4px; border-radius: 2px; background: {{track}}"><div style="width: 40%; height: 4px; border-radius: 2px; background: {{accent}}"></div></div>
        <button style="align-self: flex-start; height: 48px; padding: 0 4px; font-size: 14px; font-weight: 600; color: {{accent}}">Arrêter</button>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"view":{"editor":"enum","options":["volet","verrou"],"default":"volet"},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const lock = (this.props.view ?? 'volet') === 'verrou';
    const s = dark
      ? { bg: lock ? '#0B0E13' : '#1A1C20', fg: '#E3E2E6', fgVar: '#C4C6CF', tile: '#2E3036', card: '#2A2C31', accent: '#6FE3D0', onAccent: '#00382F', track: '#45474D' }
      : { bg: lock ? '#DCE3EA' : '#F1F3F8', fg: '#1A1C20', fgVar: '#44474E', tile: '#DDE2EB', card: '#FFFFFF', accent: '#00695C', onAccent: '#FFFFFF', track: '#C4C6CF' };
    return { ...s, isLock: lock, isShade: !lock };
  }
}
</script>
</body>
</html>
