name: musicplayer
description: "Local, free, ad-free music player with a streaming-like experience."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  collection: ^1.19.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  meta: ^1.19.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
