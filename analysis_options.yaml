include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # very_good_analysis already enables strict-casts, strict-inference and
  # strict-raw-types; they are repeated so that a lint package update cannot
  # silently drop them.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - lib/l10n/generated/**
    - "**/*.g.dart"
    - "**/*.steps.dart"
    - test/data/db/migrations/**/generated/**

linter:
  rules:
    public_member_api_docs: false

plugins:
  # Keep in step with the riverpod_lint dev dependency in pubspec.yaml.
  riverpod_lint: 3.1.9
