<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Notification et écran verrouillé</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1772px; height: 960px; display: flex; gap: 48px; font-family: Inter, system-ui, sans-serif; color: #1B2230">
  <sc-for list="{{variants}}" as="v" hint-placeholder-count="4">
    <div style="width: 412px; display: flex; flex-direction: column; gap: 12px">
      <span style="height: 33px; font-size: 18px; line-height: 33px; font-weight: 600">{{v.label}}</span>
      <dc-import name="Systeme" theme="{{v.theme}}" view="{{v.view}}" hint-size="412px,915px"></dc-import>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1772,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { variants: [
      { theme: 'dark', view: 'volet', label: '7a · Volet de notifications — sombre' },
      { theme: 'light', view: 'volet', label: '7b · Volet de notifications — clair' },
      { theme: 'dark', view: 'verrou', label: '7c · Écran verrouillé — sombre' },
      { theme: 'light', view: 'verrou', label: '7d · Écran verrouillé — clair' }
    ] };
  }
}
</script>
</body>
</html>
