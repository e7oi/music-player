<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Disques amovibles — clair</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 2252px; height: 960px; display: flex; gap: 48px; font-family: Inter, system-ui, sans-serif; color: #1B2230">
  <sc-for list="{{variants}}" as="v" hint-placeholder-count="5">
    <div style="width: 412px; display: flex; flex-direction: column; gap: 12px">
      <span style="height: 33px; font-size: 18px; line-height: 33px; font-weight: 600">{{v.label}}</span>
      <dc-import name="Disques" theme="light" state="{{v.state}}" hint-size="412px,915px"></dc-import>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2252,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { variants: [
      { state: 'connecte', label: '4a · Connecté' },
      { state: 'parcours', label: '4b · Parcours en cours (Arrêter)' },
      { state: 'absent', label: '4c · Non connecté (disque absent)' },
      { state: 'renouveler', label: '4d · Accès à renouveler' },
      { state: 'aucun', label: '4e · Aucun disque connu' }
    ] };
  }
}
</script>
</body>
</html>
